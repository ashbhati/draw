<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620">
<defs>
<filter id="boardTexture" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.021 0.028" numOctaves="4" seed="17" result="grain"/>
<feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
<feComponentTransfer in="mono" result="softGrain"><feFuncA type="table" tableValues="0 0.18"/></feComponentTransfer>
<feBlend in="SourceGraphic" in2="softGrain" mode="screen"/>
</filter>
<filter id="chalkEdge" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="8" result="rough"/>
<feDisplacementMap in="SourceGraphic" in2="rough" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="softSmudge" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#f3c94c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<radialGradient id="edgeShade"><stop offset="65%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".42"/></radialGradient>
</defs>
<rect width="1080" height="1620" fill="#18191a"/>
<rect width="1080" height="1620" filter="url(#boardTexture)" opacity=".82"/>
<path d="M 130 250 C 330 180, 590 255, 850 180 M 170 445 C 400 390, 620 500, 930 410 M 160 970 C 390 900, 660 1020, 920 915 M 190 1480 C 420 1400, 670 1510, 930 1425" fill="none" stroke="#d2d0ca" stroke-width="34" stroke-linecap="round" opacity=".055" filter="url(#softSmudge)"/>
<rect width="1080" height="1620" fill="url(#edgeShade)"/>
<text x="72" y="112" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="64px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="72" dy="0">DRAW</tspan></text>
<text x="76" y="153" fill="#e7e2d8" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="27px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="76" dy="0">One canvas now. More ways to work later.</tspan></text>
<path d="M 76 184 L 190 184" fill="none" stroke="#f3c94c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<rect x="72" y="220" width="936" height="178" rx="4" fill="#18191a" stroke="#f2eee5" stroke-width="3" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<text x="102" y="272" fill="#f3c94c" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="28px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="102" dy="0">FIRST: ONE PERSISTENT, INFINITE CANVAS</tspan></text>
<text x="102" y="323" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="27px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="102" dy="0">Several diagrams live on one canvas.</tspan><tspan x="102" dy="31.59">Edit them, save, and pick up later.</tspan></text>
<text x="78" y="466" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="34px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="78" dy="0">V1 · THE CORE LOOP</tspan></text>
<rect x="72" y="500" width="448" height="176" rx="4" fill="#18191a" stroke="#f2eee5" stroke-width="2.5" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<text x="96" y="547" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="25px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="96" dy="0">EDIT THE CANVAS</tspan></text>
<text x="96" y="588" fill="#ddd8cf" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="22px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="96" dy="0">Freehand · text · shapes</tspan><tspan x="96" dy="25.74">Arrows · select · undo / redo</tspan></text>
<rect x="560" y="500" width="448" height="176" rx="4" fill="#18191a" stroke="#f2eee5" stroke-width="2.5" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<text x="584" y="545" fill="#f3c94c" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="23px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="584" dy="0">SAVE · REOPEN · KEEP EDITING</tspan></text>
<text x="584" y="588" fill="#ddd8cf" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="22px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="584" dy="0">.draw restores all editable</tspan><tspan x="584" dy="25.74">elements, assets, and view.</tspan></text>
<rect x="72" y="700" width="448" height="176" rx="4" fill="#18191a" stroke="#f2eee5" stroke-width="2.5" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<text x="96" y="747" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="25px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="96" dy="0">PICK A BACKGROUND</tspan></text>
<text x="96" y="788" fill="#ddd8cf" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="22px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="96" dy="0">Blackboard texture or white.</tspan><tspan x="96" dy="25.74">Choice stays with the document.</tspan></text>
<rect x="560" y="700" width="448" height="176" rx="4" fill="#18191a" stroke="#f2eee5" stroke-width="2.5" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<text x="584" y="747" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="25px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="584" dy="0">EXPORT FOR SHARING</tspan></text>
<text x="584" y="788" fill="#ddd8cf" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="22px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="584" dy="0">PNG / JPEG are flattened images.</tspan><tspan x="584" dy="25.74">The .draw file keeps it editable.</tspan></text>
<rect x="72" y="900" width="936" height="130" rx="4" fill="#18191a" stroke="#79b9d2" stroke-width="3" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<text x="100" y="945" fill="#79b9d2" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="27px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="100" dy="0">MCP · CODEX CREATES NATIVE DRAW ELEMENTS</tspan></text>
<text x="100" y="984" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="22px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="100" dy="0">Create or edit on the open canvas. Then continue editing by hand.</tspan></text>
<path d="M 540 1048 L 540 1094" fill="none" stroke="#f3c94c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowHead)" filter="url(#chalkEdge)"/>
<rect x="72" y="1112" width="936" height="360" rx="4" fill="#18191a" stroke="#f3c94c" stroke-width="3" stroke-linejoin="round" stroke-dasharray="12 10" filter="url(#chalkEdge)"/>
<text x="102" y="1164" fill="#f3c94c" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="30px" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="102" dy="0">AFTER V1 · REVISIT THE NEXT NEEDS</tspan></text>
<text x="112" y="1223" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="23px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="112" dy="0">01  Organize: projects, boards, folders, pages</tspan></text>
<text x="112" y="1273" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="23px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="112" dy="0">02  Reach: accounts and cloud sync</tspan></text>
<text x="112" y="1323" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="23px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="112" dy="0">03  Share: collaborators and permissions</tspan></text>
<text x="112" y="1373" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="23px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="112" dy="0">04  Explore: Excalidraw import and broader parity</tspan></text>
<text x="112" y="1423" fill="#f6f2e9" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="23px" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="112" dy="0">05  Grow: more backgrounds, libraries, presentations</tspan></text>
<path d="M 78 1510 L 1002 1510" fill="none" stroke="#aaa69c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#chalkEdge)"/>
<text x="551.0" y="1555" fill="#f3c94c" font-family="Chalkboard, &#x27;Bradley Hand&#x27;, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="25px" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#f6f2e9" stroke-opacity=".12" stroke-width=".45" stroke-linejoin="round"><tspan x="551.0" dy="0">THE PROOF: save → reopen → edit → export</tspan></text>
</svg>