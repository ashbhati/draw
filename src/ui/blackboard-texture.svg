<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <radialGradient id="slate" cx="50%" cy="46%" r="78%">
      <stop offset="0" stop-color="#1c1d1e" />
      <stop offset=".58" stop-color="#1a1b1c" />
      <stop offset="1" stop-color="#121314" />
    </radialGradient>
    <filter id="chalk-surface" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .014" numOctaves="3" seed="17" result="slate-wear" />
      <feColorMatrix in="slate-wear" type="saturate" values="0" result="gray-wear" />
      <feComponentTransfer in="gray-wear" result="faint-wear"><feFuncA type="linear" slope=".08" /></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint-wear" mode="soft-light" result="worn-slate" />
      <feTurbulence type="fractalNoise" baseFrequency=".3 .36" numOctaves="3" seed="8" result="chalk-grain" />
      <feColorMatrix in="chalk-grain" type="saturate" values="0" result="gray-grain" />
      <feComponentTransfer in="gray-grain" result="fine-grain"><feFuncA type="linear" slope=".28" /></feComponentTransfer>
      <feBlend in="worn-slate" in2="fine-grain" mode="overlay" />
    </filter>
    <filter id="rough-chalk" x="-14%" y="-40%" width="128%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .035" numOctaves="2" seed="31" result="chalk-edge" />
      <feDisplacementMap in="SourceGraphic" in2="chalk-edge" scale="28" xChannelSelector="R" yChannelSelector="G" result="rough-stroke" />
      <feGaussianBlur in="rough-stroke" stdDeviation="3" />
    </filter>
    <filter id="soft-dust" x="-12%" y="-20%" width="124%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".04 .08" numOctaves="2" seed="22" result="dust-edge" />
      <feDisplacementMap in="SourceGraphic" in2="dust-edge" scale="14" xChannelSelector="R" yChannelSelector="G" result="rough-dust" />
      <feGaussianBlur in="rough-dust" stdDeviation="4" />
    </filter>
    <filter id="chalk-scratch" x="-8%" y="-16%" width="116%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".04 .07" numOctaves="2" seed="41" result="scratch-edge" />
      <feDisplacementMap in="SourceGraphic" in2="scratch-edge" scale="10" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#slate)" filter="url(#chalk-surface)" />

  <!-- Broad, uneven wipe marks and chalky residue, kept close to the slate tone. -->
  <g fill="none" stroke="#aaa8a1" stroke-linecap="round" filter="url(#rough-chalk)">
    <path d="M -54 122 C 16 75 86 85 146 120 S 226 161 276 129" stroke-width="78" opacity=".09" />
    <path d="M 344 91 C 411 59 466 70 517 104 S 602 146 661 116" stroke-width="54" opacity=".075" />
    <path d="M 748 133 C 813 94 864 103 922 139 S 1001 168 1058 127" stroke-width="92" opacity=".085" />
    <path d="M 31 286 C 99 245 156 248 210 279 S 280 318 329 287" stroke-width="56" opacity=".07" />
    <path d="M 636 274 C 706 238 773 239 820 273 S 908 313 977 279" stroke-width="78" opacity=".075" />
    <path d="M -40 463 C 30 414 91 418 149 452 S 233 491 291 459" stroke-width="104" opacity=".085" />
    <path d="M 389 478 C 456 445 504 444 555 470 S 632 508 681 476" stroke-width="62" opacity=".07" />
    <path d="M 805 446 C 870 407 921 419 969 449 S 1021 468 1060 443" stroke-width="88" opacity=".085" />
    <path d="M 66 33 C 121 68 172 13 227 35 S 287 56 327 39" stroke-width="42" opacity=".065" />
    <path d="M 456 222 C 502 197 542 209 572 234 M 716 385 C 758 357 805 356 844 379" stroke-width="38" opacity=".055" />
    <path d="M 177 575 C 153 524 181 475 226 451 M 730 586 C 701 537 727 493 773 470" stroke-width="32" opacity=".055" />
  </g>

  <!-- Irregular curved scrapes and chalk dust trails remain visible through the soft residue. -->
  <g fill="none" stroke="#cac8c1" stroke-linecap="round" filter="url(#chalk-scratch)">
    <path d="M -12 153 C 38 112 88 92 134 103 S 203 143 253 132" stroke-width="3.1" opacity=".13" />
    <path d="M 289 122 C 342 94 386 81 428 94 S 471 114 495 105 M 614 143 C 654 125 695 94 735 95 S 783 113 805 126" stroke-width="2.3" opacity=".14" />
    <path d="M 887 99 C 935 109 971 145 1027 105 M 56 280 C 110 253 153 258 193 280 S 236 304 270 301" stroke-width="3.5" opacity=".13" />
    <path d="M 358 285 C 406 251 457 251 496 274 S 533 297 570 290 M 686 315 C 727 287 766 283 799 300" stroke-width="2" opacity=".15" />
    <path d="M 830 302 C 883 276 931 286 970 314 M 20 511 C 73 474 116 469 154 488 S 190 516 221 514" stroke-width="3" opacity=".12" />
    <path d="M 267 483 C 307 462 336 458 369 468 M 466 517 C 504 487 548 480 582 496 M 746 470 C 786 450 824 457 850 475" stroke-width="1.8" opacity=".14" />
    <path d="M 77 224 C 111 196 140 187 173 192 M 211 202 C 249 180 279 175 309 182 M 712 210 C 754 185 783 180 817 186 M 855 203 C 891 186 920 178 948 180" stroke-width="1.8" opacity=".13" />
  </g>

  <!-- Layered curved wipe strokes leave uneven chalk edges instead of smooth haze. -->
  <g fill="none" stroke="#c0beb7" stroke-linecap="round" filter="url(#soft-dust)">
    <path d="M 8 213 C 58 144 105 112 161 115 S 234 147 274 165" stroke-width="31" opacity=".095" />
    <path d="M 312 201 C 374 148 425 147 468 175 S 518 207 553 193" stroke-width="18" opacity=".07" />
    <path d="M 723 156 C 786 116 830 118 872 140 S 925 166 971 157" stroke-width="38" opacity=".085" />
    <path d="M 71 366 C 124 328 174 325 216 344 S 260 378 300 382" stroke-width="25" opacity=".08" />
    <path d="M 486 383 C 536 348 580 340 621 358 S 672 391 703 384" stroke-width="14" opacity=".065" />
    <path d="M 818 368 C 872 323 916 326 959 354 S 1000 384 1035 371" stroke-width="32" opacity=".09" />
    <path d="M 152 541 C 199 500 240 496 276 516 S 315 543 348 543" stroke-width="20" opacity=".08" />
    <path d="M 586 536 C 631 505 671 492 703 507 M 756 250 C 804 222 848 218 884 231" stroke-width="11" opacity=".07" />
  </g>

  <!-- Short, broken chalk scuffs follow the wipe motion without repeating a grid. -->
  <g fill="none" stroke="#cbc9c2" stroke-linecap="round" filter="url(#soft-dust)">
    <path d="M 47 301 C 83 281 105 272 142 269 M 159 260 C 188 246 215 241 246 244" stroke-width="7" opacity=".12" />
    <path d="M 338 250 C 369 238 399 226 423 228 M 460 234 C 495 224 523 212 548 211" stroke-width="6" opacity=".11" />
    <path d="M 735 300 C 770 282 798 278 832 279 M 860 286 C 889 273 914 261 944 252" stroke-width="8" opacity=".12" />
    <path d="M 95 489 C 127 469 150 457 183 456 M 207 461 C 238 447 262 433 288 426" stroke-width="6" opacity=".11" />
    <path d="M 564 482 C 594 468 621 450 649 449 M 675 454 C 702 439 727 431 753 430" stroke-width="7" opacity=".11" />
    <path d="M 786 550 C 817 531 842 521 868 520 M 888 527 C 920 513 945 502 969 487" stroke-width="6" opacity=".11" />
  </g>
</svg>
