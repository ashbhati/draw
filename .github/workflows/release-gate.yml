name: Release gate

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gate:
    # Keep Playwright's Linux dependencies on a stable runner image. ubuntu-latest
    # advanced to 26.04, where apt mirror DNS prevented browser setup in CI.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium and system dependencies
        run: |
          npx playwright install --with-deps chromium || {
            echo "::warning::Combined browser and OS dependency install failed; retrying Chromium without apt dependencies."
            npx playwright install chromium
          }
      - name: Verify Playwright Chromium launches
        run: |
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close(); console.log("Playwright Chromium launched successfully");'
      - run: npm run test:release
